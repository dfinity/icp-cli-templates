[template]
name = "Hello World ICP app"
description = "Full-stack ICP app: Blazor WASM (.NET 10) frontend + Motoko backend, deployed fully on-chain"

# Never run Liquid over binary assets (non-UTF8 files are copied verbatim anyway).
exclude = ["frontend/vendor/**"]

# Never copy local build/test litter into generated projects. (cargo-generate
# does not read .gitignore, so anything git ignores is NOT automatically
# excluded here.) `ignore` matches whole files/folders, no wildcards, so every
# path below is spelled out. Missing paths are ignored.
ignore = [
  # ICP CLI runtime cache (can hold filenames with raw `{{ project-name }}`
  # placeholders, e.g. cache/artifacts/{{ project-name }}-backend, which would
  # otherwise make scaffolding fail with "invalid syntax").
  ".icp",
  "frontend/{{project-name}}/bin",
  "frontend/{{project-name}}/obj",
  "frontend/{{project-name}}/node_modules",
  "frontend/{{project-name}}/package-lock.json",
  # Log files from manual test runs.
  "frontend/{{project-name}}/npm-install.log",
  # Webpack output is regenerated by `npm run build` during deploy.
  "frontend/{{project-name}}/wwwroot/icpAgent.js",
  "frontend/{{project-name}}/wwwroot/icpAgent.js.LICENSE.txt",
]
